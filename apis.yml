description: OneKitchen is a Dubai-based cloud/ghost-kitchen enablement startup founded in 2018 that
  provided chefs, restaurants, and food entrepreneurs with shared kitchen space, equipment, and operating
  technology to launch delivery-only restaurant brands in about 48 hours at a fraction of traditional
  restaurant capital cost. It was backed by 500 Global, Chernovetskyi Investment Group, and Savour Ventures.
  As of this enrichment pass the company appears dormant - its primary domain joinonekitchen.com no longer
  resolves to a live product (it now redirects to a domain-sale parking page) and no public developer
  portal, API, documentation, or other API surface could be found.
